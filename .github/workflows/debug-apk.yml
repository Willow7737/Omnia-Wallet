name: Debug APK

# Builds an installable, debug-signed APK without requiring a local Flutter/Android setup.
# Runs automatically for changes merged or pushed to main, and can also be started manually.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnia-wallet-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish debug APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="debug-latest"
          apk_path="build/app/outputs/flutter-apk/app-debug.apk"

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" "$apk_path" --clobber
          else
            gh release create "$release_tag" "$apk_path" \
              --target "$GITHUB_SHA" \
              --title "Omnia Wallet Debug APK" \
              --notes "Latest debug APK built from commit $GITHUB_SHA. For testing only; this APK is not suitable for Google Play publication." \
              --prerelease \
              --latest=false
          fi
