org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Gradle defaults to a 30-second socket timeout and gives up after 3 attempts.
# dl.google.com and Maven Central are slow enough from some networks that a
# single large artifact exceeds that, and the whole build fails with
# "Read timed out" on one .pom. These are the documented knobs for it; they
# only affect how patiently Gradle waits, never what it resolves.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=6
systemProp.org.gradle.internal.repository.initial.backoff=500
